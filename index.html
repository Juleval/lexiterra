async function open(raw){if(document.readyState==='loading')await new Promise(r=>document.addEventListener('DOMContentLoaded',r,{once:true}));const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);

 document.open();document.write(html);document.close()}
async function derive(pass){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveBits']);
